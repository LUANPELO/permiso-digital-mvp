<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Permiso Digital — Temporalmente no disponible</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #24503a 100%);
      color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 480px; text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 44px 32px;
      backdrop-filter: blur(6px);
    }
    .icono {
      width: 64px; height: 64px; margin: 0 auto 22px;
      border-radius: 16px; background: #2d8c3e;
      display: flex; align-items: center; justify-content: center;
    }
    .icono svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 2; }
    .marca { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 14px; line-height: 1.2; }
    p { font-size: 15px; line-height: 1.6; opacity: 0.9; margin-bottom: 8px; }
    .small { font-size: 13px; opacity: 0.6; margin-top: 18px; }
    .barra { height: 4px; width: 90px; margin: 24px auto 0; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; position: relative; }
    .barra::after { content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; background: #2d8c3e; border-radius: 999px; animation: mov 1.6s ease-in-out infinite; }
    @keyframes mov { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icono">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9"></circle>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2"></path>
      </svg>
    </div>
    <div class="marca">Permiso Digital</div>
    <h1>Temporalmente no disponible</h1>
    <p>Estamos realizando mejoras en la plataforma.</p>
    <p>Volveremos muy pronto.</p>
    <div class="barra"></div>
    <p class="small">Gracias por tu paciencia.</p>
  </main>
</body>
</html>
